<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback, createContext, useContext } = React;

// ---------------------------------------------------------------------------
// API helpers
// ---------------------------------------------------------------------------
const TOKEN_KEY = 'trans_kr2eng_token';
const getToken = () => localStorage.getItem(TOKEN_KEY);
const setToken = (t) => (t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY));

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (!(opts.body instanceof FormData) && !headers['Content-Type'] && opts.body) {
    headers['Content-Type'] = 'application/json';
  }
  const tok = getToken();
  if (tok) headers.Authorization = `Bearer ${tok}`;
  const r = await fetch(path, { ...opts, headers });
  let j = null;
  try { j = await r.json(); } catch {}
  if (!r.ok || !j || j.success === false) {
    const err = new Error((j && j.message) || `HTTP ${r.status}`);
    err.status = r.status;
    throw err;
  }
  return j.data;
}

// ---------------------------------------------------------------------------
// Hash router
// ---------------------------------------------------------------------------
function useHashRoute() {
  const parse = () => (location.hash || '#/').replace(/^#/, '') || '/';
  const [path, setPath] = useState(parse());
  useEffect(() => {
    const onChange = () => setPath(parse());
    window.addEventListener('hashchange', onChange);
    return () => window.removeEventListener('hashchange', onChange);
  }, []);
  return path;
}
const navigate = (p) => { location.hash = p.startsWith('/') ? `#${p}` : `#/${p}`; };

// ---------------------------------------------------------------------------
// Auth context
// ---------------------------------------------------------------------------
const AuthCtx = createContext(null);

function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    (async () => {
      if (!getToken()) { setLoading(false); return; }
      try { setUser(await api('/api/auth/me')); }
      catch { setToken(null); }
      finally { setLoading(false); }
    })();
  }, []);
  const login = async (email, password) => {
    const d = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
    setToken(d.token); setUser(d.user); return d.user;
  };
  const signup = async (payload) => {
    const d = await api('/api/auth/signup', { method: 'POST', body: JSON.stringify(payload) });
    setToken(d.token); setUser(d.user); return d.user;
  };
  const logout = () => { setToken(null); setUser(null); navigate('/'); };
  return <AuthCtx.Provider value={{ user, loading, login, signup, logout }}>{children}</AuthCtx.Provider>;
}
const useAuth = () => useContext(AuthCtx);

async function uploadImage(file) {
  const auth = await api('/api/upload/auth');
  const fd = new FormData();
  fd.append('file', file);
  fd.append('fileName', `tradestmt_${Date.now()}_${file.name.replace(/[^a-z0-9.\-_]/gi, '_')}`);
  fd.append('publicKey', auth.publicKey);
  fd.append('signature', auth.signature);
  fd.append('expire', auth.expire);
  fd.append('token', auth.token);
  fd.append('folder', '/trans-kr2eng');
  fd.append('useUniqueFileName', 'true');
  const r = await fetch('https://upload.imagekit.io/api/v1/files/upload', { method: 'POST', body: fd });
  const j = await r.json();
  if (!r.ok || !j.url) throw new Error(j.message || 'ImageKit 업로드 실패');
  return j.url;
}

// ---------------------------------------------------------------------------
// Design system
// ---------------------------------------------------------------------------
function Divider({ label = '' }) {
  return (
    <div className="divider">
      <span className="mark">✦</span>
      <span>{label}</span>
      <span className="mark">✦</span>
    </div>
  );
}

function Card({ children, className = '' }) {
  return (
    <section className={`bg-white rounded-2xl border border-gold-100 shadow-sm p-5 ${className}`}>
      {children}
    </section>

}

function Header({ onOpenDoc, onOpenAuth, onOpenGallery }) {
  const { user, logout } = useAuth();
  return (
    <header className="border-b border-gold-100 bg-white/80 backdrop-blur sticky top-0 z-30">
      <div className="max-w-6xl mx-auto px-5 h-14 flex items-center justify-between gap-3">
        <a href="#/" className="flex items-center gap-2">
          <span className="text-xl">📄</span>
          <span className="font-bold text-ink-700 tracking-tight">TradeStatement EN</span>
          <span className="hidden sm:inline text-xs text-gold-700 ml-1">거래내역서 영문 변환기</span>
        </a>
        <nav className="flex items-center gap-1 text-sm">
          <a className="nav-link" href="#/">🏠 홈</a>
          {user && <a className="nav-link" href="#/history">📜 변환 이력</a>}
          <button className="nav-link" onClick={() => onOpenDoc('mission')}>📋 기획서</button>
          <button className="nav-link" onClick={() => onOpenDoc('dev')}>🛠️ 개발문서</button>
          <button className="nav-link" onClick={() => onOpenGallery('documents')}>📂 데모 자료</button>
          <button className="nav-link" onClick={() => onOpenGallery('screenshot')}>🖼️ 작업 캡처</button>
          {user ? (
            <div className="flex items-center gap-1 ml-2 pl-3 border-l border-gold-100">
              <span className="text-xs text-gray-500 hidden sm:inline">{user.display_name}</span>
              <button className="nav-link text-gray-400 hover:text-red-500" onClick={logout}>로그아웃</button>
            </div>
          ) : (
            <div className="flex items-center gap-1 ml-2 pl-3 border-l border-gold-100">
              <button className="nav-link" onClick={() => onOpenAuth('login')}>로그인</button>
              <button className="btn-primary" style={{ height: 32, padding: '0 12px', fontSize: 13 }} onClick={() => onOpenAuth('signup')}>가입</button>
            </div>
          )}
        </nav>
      </div>
    </header>
  );
}

function AuthModal({ mode, onClose, onSwitch }) {
  const { login, signup } = useAuth();
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [displayName, setDisplayName] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    if (mode) window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [mode, onClose]);
  if (!mode) return null;
  const submit = async (e) => {
    e.preventDefault(); setErr(''); setBusy(true);
    try {
      if (mode === 'login') await login(email, password);
      else await signup({ email, password, display_name: displayName });
      onClose();
    } catch (ex) { setErr(ex.message); }
    finally { setBusy(false); }
  };
  return (
    <div className="modal-backdrop fade-in" onClick={onClose}>
      <div className="modal-panel" style={{ maxWidth: 420 }} onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="font-bold text-ink-700 text-lg">{mode === 'login' ? '🔐 로그인' : '✨ 회원가입'}</div>
            <div className="text-xs text-gray-500 mt-0.5">
              {mode === 'login' ? '이메일과 비밀번호를 입력해주세요' : '지점/이름을 함께 적어주세요'}
            </div>
          </div>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-700 text-xl">✕</button>
        </div>
        <form className="modal-body space-y-3" onSubmit={submit}>
          <label className="block">
            <div className="text-xs font-semibold text-gray-600 mb-1">이메일</div>
            <input className="input" type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="branch@company.co.kr" />
          </label>
          <label className="block">
            <div className="text-xs font-semibold text-gray-600 mb-1">비밀번호 {mode === 'signup' && <span className="text-gray-400">(6자 이상)</span>}</div>
            <input className="input" type="password" required minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} />
          </label>
          {mode === 'signup' && (
            <label className="block">
              <div className="text-xs font-semibold text-gray-600 mb-1">이름</div>
              <input className="input" required maxLength={30} value={displayName} onChange={(e) => setDisplayName(e.target.value)} placeholder="예: 강남지점 김지점" />
            </label>
          )}
          {err && <div className="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2">⚠️ {err}</div>}
          <button className="btn-primary w-full" disabled={busy}>
            {busy ? '...' : mode === 'login' ? '로그인' : '가입하고 시작'}
          </button>
          <div className="text-center text-xs text-gray-500 pt-1">
            {mode === 'login' ? (
              <>처음이세요? <button type="button" className="text-ink-700 font-semibold underline" onClick={() => onSwitch('signup')}>가입하기</button></>
            ) : (
              <>이미 계정이 있나요? <button type="button" className="text-ink-700 font-semibold underline" onClick={() => onSwitch('login')}>로그인</button></>
            )}
          </div>
        </form>
      </div>
    </div>
  );
}

function GalleryModal({ folder, onClose }) {
  const [data, setData] = useState(null);
  const [err, setErr] = useState('');
  const [idx, setIdx] = useState(0);
  useEffect(() => {
    if (!folder) return;
    setData(null); setErr(''); setIdx(0);
    api(`/api/screenshots/${folder}`).then(setData).catch((e) => setErr(e.message));
  }, [folder]);
  const files = data?.files || [];
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') onClose();
      else if (e.key === 'ArrowLeft' && files.length > 1) setIdx((i) => (i - 1 + files.length) % files.length);
      else if (e.key === 'ArrowRight' && files.length > 1) setIdx((i) => (i + 1) % files.length);
    };
    if (folder) window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [folder, files.length, onClose]);
  if (!folder) return null;
  const cur = files[idx];
  return (
    <div className="modal-backdrop fade-in" onClick={onClose}>
      <div
        className="modal-panel"
        style={{ maxWidth: 1280, width: '100%', maxHeight: '90vh', display: 'flex', flexDirection: 'column' }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="modal-head">
          <div>
            <div className="font-bold text-ink-700 text-lg">{data?.label || '🖼️ 갤러리'}</div>
            <div className="text-xs text-gray-500 mt-0.5">
              {folder}/ 폴더 · {files.length > 0 ? `${idx + 1} / ${files.length}` : '...'} · 좌측 목록에서 파일 선택 · ← → 키로 이동
            </div>
          </div>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-700 text-xl">✕</button>
        </div>

        {err && <div className="text-sm text-red-600 p-4">⚠️ {err}</div>}
        {!data && !err && <div className="text-center text-gray-400 py-16">불러오는 중...</div>}
        {data && files.length === 0 && <div className="text-center text-gray-400 py-16">아직 이미지가 없어요</div>}

        {cur && (
          <div style={{ display: 'flex', flex: 1, minHeight: 0 }}>
            {/* ── 좌측: 파일 리스트 ── */}
            <aside
              style={{ width: 300, flexShrink: 0, borderRight: '1px solid #f5ecd5', background: '#fbf8f1', overflowY: 'auto' }}
            >
              <div className="px-3 py-2 text-[11px] uppercase tracking-wider text-gold-700 font-semibold border-b border-gold-100 sticky top-0 bg-cream-50">
                파일 ({files.length})
              </div>
              <ul>
                {files.map((f, i) => {
                  const sel = i === idx;
                  return (
                    <li key={f.name}>
                      <button
                        onClick={() => setIdx(i)}
                        className="w-full text-left flex items-center gap-2.5 px-3 py-2 transition"
                        style={{
                          background: sel ? '#1f3a5f' : 'transparent',
                          color: sel ? 'white' : '#13243d',
                          borderLeft: sel ? '3px solid #c9b88c' : '3px solid transparent',
                        }}
                        onMouseEnter={(e) => { if (!sel) e.currentTarget.style.background = '#f5ecd5'; }}
                        onMouseLeave={(e) => { if (!sel) e.currentTarget.style.background = 'transparent'; }}
                        title={f.name}
                      >
                        <img
                          src={`/api/screenshots/${folder}/file?name=${encodeURIComponent(f.name)}`}
                          alt={f.name}
                          loading="lazy"
                          style={{ width: 44, height: 30, objectFit: 'cover', borderRadius: 4, background: 'white', flexShrink: 0 }}
                        />
                        <div style={{ minWidth: 0, flex: 1 }}>
                          <div style={{ fontSize: 12, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                            {i + 1}. {f.name}
                          </div>
                          <div style={{ fontSize: 10, opacity: 0.7, marginTop: 1 }}>
                            {(f.size / 1024).toFixed(0)} KB
                          </div>
                        </div>
                      </button>
                    </li>
                  );
                })}
              </ul>
            </aside>

            {/* ── 우측: 큰 미리보기 ── */}
            <section style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
              <div className="px-5 py-3 border-b border-gold-100 bg-cream-50">
                <div className="font-semibold text-ink-700 text-sm truncate" title={cur.name}>📄 {cur.name}</div>
                <div className="text-xs text-gray-500 mt-0.5">
                  {(cur.size / 1024).toFixed(0)} KB · {new Date(cur.mtime).toLocaleString('ko-KR')}
                </div>
              </div>
              <div className="relative" style={{ flex: 1, minHeight: 380, background: '#13243d' }}>
                <img
                  src={`/api/screenshots/${folder}/file?name=${encodeURIComponent(cur.name)}`}
                  alt={cur.name}
                  style={{ width: '100%', height: '100%', objectFit: 'contain', position: 'absolute', inset: 0 }}
                />
                {files.length > 1 && (
                  <>
                    <button
                      onClick={() => setIdx((i) => (i - 1 + files.length) % files.length)}
                      className="absolute left-3 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/15 hover:bg-white/30 text-white text-2xl"
                      title="이전 (←)"
                    >‹</button>
                    <button
                      onClick={() => setIdx((i) => (i + 1) % files.length)}
                      className="absolute right-3 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/15 hover:bg-white/30 text-white text-2xl"
                      title="다음 (→)"
                    >›</button>
                    <div className="absolute top-3 left-3 px-2.5 py-1 rounded-full bg-black/50 text-white text-xs">
                      {idx + 1} / {files.length}
                    </div>
                  </>
                )}
              </div>
            </section>
          </div>
        )}
      </div>
    </div>
  );
}

function DocsModal({ name, onClose }) {
  const [doc, setDoc] = useState(null);
  const [err, setErr] = useState('');
  useEffect(() => {
    if (!name) return;
    setDoc(null); setErr('');
    api(`/api/docs/${name}`).then(setDoc).catch((e) => setErr(e.message));
  }, [name]);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    if (name) window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [name, onClose]);
  if (!name) return null;
  const html = doc && window.marked ? window.marked.parse(doc.content) : '';
  return (
    <div className="modal-backdrop fade-in" onClick={onClose}>
      <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="font-bold text-ink-700 text-lg">{doc?.title || (name === 'mission' ? '기획서' : '개발문서')}</div>
            <div className="text-xs text-gray-500 mt-0.5">
              {name === 'mission'
                ? 'documents/MISSION.md · 제품 비전 · 사용자 · v1 범위 · 성공지표'
                : 'documents/DEV.md · 선택된 구조 · TODO 로드맵 · 외부 설정'}
            </div>
          </div>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-700 text-xl" title="닫기 (Esc)">✕</button>
        </div>
        <div className="modal-body">
          {err && <div className="text-sm text-red-600">⚠️ {err}</div>}
          {!doc && !err && <div className="text-center text-gray-400 py-12">불러오는 중...</div>}
          {doc && <article className="prose" dangerouslySetInnerHTML={{ __html: html }} />}
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Upload step
// ---------------------------------------------------------------------------
function UploadStep({ onParsed, busy, setBusy, setErr }) {
  const [tab, setTab] = useState('file'); // 'file' | 'image'
  const [drag, setDrag] = useState(false);
  const fileRef = useRef();
  const imgRef = useRef();

  const handleFile = useCallback(async (file) => {
    setErr(''); setBusy(true);
    try {
      const fd = new FormData();
      fd.append('file', file);
      const data = await api('/api/parse-file', { method: 'POST', body: fd });
      if (!data.rows.length) throw new Error('인식된 거래 행이 없어요. 열 헤더(일자/종목명/적요/수량/단가/금액)를 확인해주세요.');
      onParsed(data);
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  }, [onParsed, setBusy, setErr]);

  const handleImage = useCallback(async (file) => {
    setErr(''); setBusy(true);
    try {
      const url = await uploadImage(file);
      const data = await api('/api/parse-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, source_name: file.name }),
      });
      if (!data.rows.length) throw new Error('이미지에서 거래 행을 추출하지 못했어요. 더 선명한 화면을 올려주세요.');
      onParsed(data);
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  }, [onParsed, setBusy, setErr]);

  const onDrop = (e) => {
    e.preventDefault(); setDrag(false);
    const f = e.dataTransfer.files?.[0];
    if (!f) return;
    if (tab === 'file') handleFile(f); else handleImage(f);
  };

  return (
    <Card>
      <div className="flex items-center gap-2 mb-3 border-b border-gold-100">
        <div className={`tab ${tab === 'file'  ? 'active' : ''}`} onClick={() => setTab('file')}>📊 엑셀 / CSV</div>
        <div className={`tab ${tab === 'image' ? 'active' : ''}`} onClick={() => setTab('image')}>🖼️ 이미지 (HTS 캡처)</div>
      </div>

      <div
        className={`dropzone ${drag ? 'drag' : ''}`}
        onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
        onDragLeave={() => setDrag(false)}
        onDrop={onDrop}
      >
        <div className="text-3xl mb-2">{tab === 'file' ? '📥' : '📸'}</div>
        <div className="font-semibold text-ink-700">
          {tab === 'file' ? '엑셀/CSV 파일을 끌어다 놓거나 선택하세요' : 'HTS 화면 캡처·스캔 이미지를 끌어다 놓거나 선택하세요'}
        </div>
        <div className="text-xs text-gray-500 mt-1">
          {tab === 'file'
            ? '인식 가능한 헤더: 일자 · 종목명 · 적요 · 수량 · 단가 · 거래금액 · 통화'
            : 'PNG/JPG · 10MB 이하 · ImageKit에 업로드 후 Gemini Vision으로 거래 행을 추출합니다'}
        </div>
        <div className="mt-4">
          {tab === 'file' ? (
            <>
              <button className="btn-primary" disabled={busy} onClick={() => fileRef.current?.click()}>
                {busy ? '읽는 중...' : '파일 선택'}
              </button>
              <input ref={fileRef} type="file" className="hidden"
                accept=".xlsx,.xls,.csv"
                onChange={(e) => e.target.files?.[0] && handleFile(e.target.files[0])} />
            </>
          ) : (
            <>
              <button className="btn-primary" disabled={busy} onClick={() => imgRef.current?.click()}>
                {busy ? 'AI가 읽는 중...' : '이미지 선택'}
              </button>
              <input ref={imgRef} type="file" className="hidden"
                accept="image/png,image/jpeg,image/jpg"
                onChange={(e) => e.target.files?.[0] && handleImage(e.target.files[0])} />
            </>
          )}
        </div>
      </div>

      <div className="mt-3 text-xs text-gray-500">
        {tab === 'file'
          ? '※ 첫 행을 헤더로 인식합니다. 종목명/적요만 한글이어도 OK — 사전 매칭 + AI fallback으로 영문 변환됩니다.'
          : '※ 이미지는 ImageKit에 업로드된 뒤 Gemini가 거래 행을 표 구조로 추출합니다. 인식이 부정확하면 미리보기에서 직접 수정하세요.'}
      </div>
    </Card>
  );
}

// ---------------------------------------------------------------------------
// Preview + Convert step
// ---------------------------------------------------------------------------
function PreviewStep({ parsed, onConverted, busy, setBusy, setErr, onReset }) {
  // editable rows
  const [rows, setRows] = useState(() => parsed.rows.map(r => ({
    date: r.date || '', stock_ko: r.stock_ko || '', memo_ko: r.memo_ko || '',
    quantity: r.quantity || '', unit_price: r.unit_price || '',
    amount: r.amount || '', currency: r.currency || 'KRW',
  })));
  // 제목 기본값: 파일명에서 확장자 제거
  const defaultTitle = (parsed.source_name || '').replace(/\.[^.]+$/, '');
  const [title, setTitle] = useState(defaultTitle);
  const update = (idx, key, val) => setRows((p) => p.map((r, i) => i === idx ? { ...r, [key]: val } : r));
  const remove = (idx) => setRows((p) => p.filter((_, i) => i !== idx));

  const convert = async () => {
    setErr(''); setBusy(true);
    try {
      const data = await api('/api/convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          rows,
          title: title.trim(),
          source_type: parsed.source_type,
          source_name: parsed.source_name,
          source_image_url: parsed.source_image_url || '',
        }),
      });
      onConverted({ ...parsed, title: data.title, rows: data.rows, job_id: data.job_id, ai_new_terms: data.ai_new_terms });
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };

  return (
    <Card>
      <div className="flex items-center justify-between mb-3">
        <div>
          <div className="font-bold text-ink-700">📋 한글 거래내역 미리보기</div>
          <div className="text-xs text-gray-500 mt-0.5">
            {parsed.source_type === 'image' ? '🖼️' : '📊'} {parsed.source_name} · {rows.length} 행
          </div>
        </div>
        <div className="flex gap-2">
          <button className="btn-ghost" onClick={onReset}>다시 업로드</button>
          <button className="btn-primary" onClick={convert} disabled={busy || rows.length === 0}>
            {busy ? '변환 중...' : '⇨ 영문으로 변환'}
          </button>
        </div>
      </div>

      <div className="mb-3 bg-cream-50 rounded-xl border border-gold-100 p-3">
        <div className="text-xs font-semibold text-ink-700 mb-1">📌 이번 변환 제목 <span className="text-gray-400 font-normal">— 이력·다운로드 파일에 사용돼요</span></div>
        <input
          className="input"
          value={title}
          maxLength={120}
          onChange={(e) => setTitle(e.target.value)}
          placeholder="예: 2026년 4월 김OO 고객 거래내역서"
        />
      </div>

      {parsed.source_image_url && (
        <div className="mb-3">
          <img src={parsed.source_image_url} alt="원본 이미지" className="max-h-56 rounded-lg border border-gold-100" />
        </div>
      )}

      <div className="overflow-auto rounded-lg border border-gold-100">
        <table className="fancy">
          <thead>
            <tr>
              <th>No.</th><th>일자</th><th>종목명 (KR)</th><th>적요 (KR)</th>
              <th>수량</th><th>단가</th><th>금액</th><th>통화</th><th></th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i}>
                <td>{i + 1}</td>
                <td><input className="input" style={{ height: 30, fontSize: 12, padding: '0 6px' }} value={r.date} onChange={(e) => update(i, 'date', e.target.value)} /></td>
                <td><input className="input" style={{ height: 30, fontSize: 12, padding: '0 6px' }} value={r.stock_ko} onChange={(e) => update(i, 'stock_ko', e.target.value)} /></td>
                <td><input className="input" style={{ height: 30, fontSize: 12, padding: '0 6px' }} value={r.memo_ko} onChange={(e) => update(i, 'memo_ko', e.target.value)} /></td>
                <td className="num"><input className="input" style={{ height: 30, fontSize: 12, padding: '0 6px', textAlign: 'right' }} value={r.quantity} onChange={(e) => update(i, 'quantity', e.target.value)} /></td>
                <td className="num"><input className="input" style={{ height: 30, fontSize: 12, padding: '0 6px', textAlign: 'right' }} value={r.unit_price} onChange={(e) => update(i, 'unit_price', e.target.value)} /></td>
                <td className="num"><input className="input" style={{ height: 30, fontSize: 12, padding: '0 6px', textAlign: 'right' }} value={r.amount} onChange={(e) => update(i, 'amount', e.target.value)} /></td>
                <td><input className="input" style={{ height: 30, fontSize: 12, padding: '0 6px' }} value={r.currency} onChange={(e) => update(i, 'currency', e.target.value)} /></td>
                <td><button onClick={() => remove(i)} className="text-gray-400 hover:text-red-500" title="행 삭제">✕</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Card>
  );
}

// ---------------------------------------------------------------------------
// Result + Download step
// ---------------------------------------------------------------------------
function ResultStep({ result, onReset, setErr }) {
  const [downloading, setDownloading] = useState('');

  const download = async (kind) => {
    setErr(''); setDownloading(kind);
    try {
      const tok = getToken();
      const r = await fetch(`/api/download/${kind}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(tok ? { Authorization: `Bearer ${tok}` } : {}),
        },
        body: JSON.stringify({ rows: result.rows, source_name: result.source_name, title: result.title }),
      });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.message || `HTTP ${r.status}`);
      }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `trade-statement-en-${Date.now()}.${kind === 'pdf' ? 'pdf' : 'xlsx'}`;
      document.body.appendChild(a); a.click();
      a.remove(); URL.revokeObjectURL(url);
    } catch (e) { setErr(e.message); }
    finally { setDownloading(''); }
  };

  return (
    <Card>
      <div className="flex items-center justify-between mb-3">
        <div>
          {result.title && <div className="text-lg font-bold text-ink-700">📌 {result.title}</div>}
          <div className="font-bold text-ink-700">✅ 영문 변환 결과</div>
          <div className="text-xs text-gray-500 mt-0.5">
            Job #{result.job_id} · {result.rows.length} 행 ·{' '}
            <span className="text-gold-700">신규 AI 번역 {result.ai_new_terms}건이 사전에 누적됨</span>
          </div>
        </div>
        <div className="flex gap-2">
          <button className="btn-ghost" onClick={onReset}>새 변환</button>
          <button className="btn-primary" disabled={!!downloading} onClick={() => download('excel')}>
            {downloading === 'excel' ? '준비 중...' : '📥 영문 Excel'}
          </button>
          <button className="btn-primary" disabled={!!downloading} onClick={() => download('pdf')}>
            {downloading === 'pdf' ? '준비 중...' : '📄 영문 PDF'}
          </button>
        </div>
      </div>

      <div className="overflow-auto rounded-lg border border-gold-100">
        <table className="fancy">
          <thead>
            <tr>
              <th>No.</th><th>Date</th>
              <th>Stock (KR → EN)</th><th>Memo (KR → EN)</th>
              <th>Quantity</th><th>Unit Price</th><th>Amount</th><th>CCY</th>
            </tr>
          </thead>
          <tbody>
            {result.rows.map((r, i) => (
              <tr key={i}>
                <td>{i + 1}</td>
                <td>{r.date}</td>
                <td>
                  <div className="text-gray-400 text-xs">{r.stock_ko}</div>
                  <div className="font-semibold text-ink-700">{r.stock_en || <span className="text-red-500 text-xs">— 미번역 —</span>}</div>
                </td>
                <td>
                  <div className="text-gray-400 text-xs">{r.memo_ko}</div>
                  <div className="font-semibold text-ink-700">{r.memo_en || <span className="text-red-500 text-xs">— 미번역 —</span>}</div>
                </td>
                <td className="num">{r.quantity}</td>
                <td className="num">{r.unit_price}</td>
                <td className="num">{r.amount}</td>
                <td>{r.currency}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Card>
  );
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function JobDetailView({ id }) {
  const { user, loading } = useAuth();
  const [job, setJob] = useState(null);
  const [err, setErr] = useState('');
  const [downloading, setDownloading] = useState('');
  useEffect(() => {
    if (loading) return;
    if (!user) return;
    api(`/api/jobs/${id}`).then(setJob).catch((e) => setErr(e.message));
  }, [id, user, loading]);

  const download = async (kind) => {
    if (!job) return;
    setDownloading(kind);
    try {
      const tok = getToken();
      const r = await fetch(`/api/download/${kind}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${tok}` },
        body: JSON.stringify({ rows: job.rows, source_name: job.source_name, title: job.title }),
      });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.message || `HTTP ${r.status}`);
      }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `trade-statement-en-job${job.id}.${kind === 'pdf' ? 'pdf' : 'xlsx'}`;
      document.body.appendChild(a); a.click();
      a.remove(); URL.revokeObjectURL(url);
    } catch (e) { setErr(e.message); }
    finally { setDownloading(''); }
  };

  if (loading) return <div className="text-center text-gray-400 py-12">불러오는 중...</div>;
  if (!user) return null;
  if (err) return <div className="text-sm text-red-600">⚠️ {err}</div>;
  if (!job) return <div className="text-center text-gray-400 py-12">불러오는 중...</div>;

  return (
    <Card>
      <div className="flex items-center justify-between mb-3">
        <div>
          <div className="font-bold text-ink-700 text-lg">
            📄 {job.title || `Job #${job.id}`}
          </div>
          <div className="text-xs text-gray-500 mt-0.5">
            Job #{job.id} · {fmtDate(job.created_at)} · {job.source_type === 'image' ? '🖼️ 이미지' : '📊 엑셀'} · {job.source_name || '—'} · {job.row_count} 행 · 신규 AI {job.ai_new_terms}건
          </div>
        </div>
        <div className="flex gap-2">
          <a href="#/history" className="btn-ghost">← 이력</a>
          <button className="btn-primary" disabled={!!downloading} onClick={() => download('excel')}>
            {downloading === 'excel' ? '준비 중...' : '📥 Excel'}
          </button>
          <button className="btn-primary" disabled={!!downloading} onClick={() => download('pdf')}>
            {downloading === 'pdf' ? '준비 중...' : '📄 PDF'}
          </button>
        </div>
      </div>
      {job.source_image_url && (
        <img src={job.source_image_url} alt="원본 이미지" className="max-h-56 rounded-lg border border-gold-100 mb-3" />
      )}
      <div className="overflow-auto rounded-lg border border-gold-100">
        <table className="fancy">
          <thead>
            <tr>
              <th>No.</th><th>Date</th>
              <th>Stock (KR → EN)</th><th>Memo (KR → EN)</th>
              <th>Quantity</th><th>Unit Price</th><th>Amount</th><th>CCY</th>
            </tr>
          </thead>
          <tbody>
            {job.rows.map((r, i) => (
              <tr key={i}>
                <td>{i + 1}</td>
                <td>{r.date}</td>
                <td>
                  <div className="text-gray-400 text-xs">{r.stock_ko}</div>
                  <div className="font-semibold text-ink-700">{r.stock_en || <span className="text-red-500 text-xs">— 미번역 —</span>}</div>
                </td>
                <td>
                  <div className="text-gray-400 text-xs">{r.memo_ko}</div>
                  <div className="font-semibold text-ink-700">{r.memo_en || <span className="text-red-500 text-xs">— 미번역 —</span>}</div>
                </td>
                <td className="num">{r.quantity}</td>
                <td className="num">{r.unit_price}</td>
                <td className="num">{r.amount}</td>
                <td>{r.currency}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Card>
  );
}

// ---------------------------------------------------------------------------
// Home view
// ---------------------------------------------------------------------------
function HomeView({ parsed, setParsed, result, setResult, busy, setBusy, err, setErr, onOpenAuth }) {
  const { user } = useAuth();
  const reset = () => { setParsed(null); setResult(null); setErr(''); };
  return (
    <>
      <section className="bg-gradient-to-br from-ink-700 to-ink-800 text-white rounded-3xl p-6 mb-2">
        <div className="text-xs text-gold-300 font-semibold tracking-wide">증권 거래내역서 · KR → EN</div>
        <h1 className="text-2xl sm:text-3xl font-bold mt-1">반나절이 걸리던 영문 변환을 30초 안에.</h1>
        <p className="text-sm text-ink-100 mt-2 max-w-2xl">
          지점 직원이 한글 거래내역서를 그대로 올리면, 사전 매칭 + Gemini가 종목명·적요를 영문으로 바꾸고 공식 PDF·엑셀로 내려줍니다.
          한 번 번역된 표현은 사전에 누적되어, 다음부터는 회사 전체가 같은 영문을 씁니다.
        </p>
      </section>

      <Divider label="Workflow" />

      {!user && (
        <Card>
          <div className="text-center py-6">
            <div className="text-3xl mb-2">🔐</div>
            <div className="font-semibold text-ink-700">먼저 로그인이 필요해요</div>
            <div className="text-xs text-gray-500 mt-1 mb-3">변환 이력은 직원별로 안전하게 관리됩니다.</div>
            <div className="flex justify-center gap-2">
              <button className="btn-ghost" onClick={() => onOpenAuth('login')}>로그인</button>
              <button className="btn-primary" onClick={() => onOpenAuth('signup')}>가입하기</button>
            </div>
          </div>
        </Card>
      )}

      {user && !parsed && (
        <UploadStep onParsed={setParsed} busy={busy} setBusy={setBusy} setErr={setErr} />
      )}

      {user && parsed && !result && (
        <PreviewStep parsed={parsed} onConverted={setResult} busy={busy} setBusy={setBusy} setErr={setErr} onReset={reset} />
      )}

      {user && result && (
        <ResultStep result={result} onReset={reset} setErr={setErr} />
      )}

      {err && (
        <div className="mt-3 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-4 py-2 fade-in">
          ⚠️ {err}
        </div>
      )}
    </>
  );
}

// ---------------------------------------------------------------------------
// App
// ---------------------------------------------------------------------------
function App() {
  const path = useHashRoute();
  const { loading } = useAuth();
  const [parsed, setParsed]   = useState(null);
  const [result, setResult]   = useState(null);
  const [busy, setBusy]       = useState(false);
  const [err, setErr]         = useState('');
  const [docName, setDocName] = useState(null);
  const [authMode, setAuthMode] = useState(null);   // 'login' | 'signup' | null
  const [gallery, setGallery] = useState(null);     // 'documents' | 'screenshot' | null

  // Clear in-flight state when navigating away from home
  useEffect(() => {
    if (path !== '/') { setErr(''); }
  }, [path]);

  let body;
  if (loading) {
    body = <div className="text-center text-gray-400 py-12">불러오는 중...</div>;
  } else if (path === '/' || path === '') {
    body = (
      <HomeView
        parsed={parsed} setParsed={setParsed}
        result={result} setResult={setResult}
        busy={busy} setBusy={setBusy}
        err={err} setErr={setErr}
        onOpenAuth={setAuthMode}
      />
    );
  } else if (path === '/history') {
    body = <HistoryView />;
  } else if (path.match(/^\/jobs\/(\d+)$/)) {
    body = <JobDetailView id={path.match(/^\/jobs\/(\d+)$/)[1]} />;
  } else {
    body = (
      <Card>
        <div className="text-center py-8">
          <div className="text-3xl mb-2">🌿</div>
          <div className="font-semibold text-ink-700">페이지를 찾지 못했어요</div>
          <a href="#/" className="text-ink-700 font-semibold underline text-sm mt-2 inline-block">홈으로</a>
        </div>
      </Card>
    );
  }

  return (
    <div className="min-h-full pb-16">
      <Header onOpenDoc={setDocName} onOpenAuth={setAuthMode} onOpenGallery={setGallery} />
      <main className="max-w-6xl mx-auto px-5 py-6">
        {body}

        {path === '/' && (
          <>
            <Divider label="Library" />
            <DictionaryPanel />
          </>
        )}

        <Divider label="About" />

        <div className="text-xs text-gray-500 text-center">
          <p>Single-file React + Express · Gemini 2.5 Flash · ImageKit · Supabase Postgres · JWT auth</p>
          <p className="mt-1">
            © Trade Statement EN — for internal use only ·{' '}
            <button className="underline hover:text-ink-700" onClick={() => setDocName('mission')}>기획서</button>{' '}·{' '}
            <button className="underline hover:text-ink-700" onClick={() => setDocName('dev')}>개발문서</button>
          </p>
        </div>
      </main>

      <DocsModal name={docName} onClose={() => setDocName(null)} />
      <AuthModal mode={authMode} onClose={() => setAuthMode(null)} onSwitch={setAuthMode} />
      <GalleryModal folder={gallery} onClose={() => setGallery(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AuthProvider><App /></AuthProvider>);
</script>
</body>
</html>
