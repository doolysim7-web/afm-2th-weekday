<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback } = React;

// ---------------------------------------------------------------------------
// API helpers
// ---------------------------------------------------------------------------
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  let j = null;
  try { j = await r.json(); } catch {}
  if (!r.ok || !j || j.success === false) {
    throw new Error((j && j.message) || `HTTP ${r.status}`);
  }
  return j.data;
}

async function uploadImage(file) {
  const auth = await api('/api/upload/auth');
  const fd = new FormData();
  fd.append('file', file);
  fd.append('fileName', `tradestmt_${Date.now()}_${file.name.replace(/[^a-z0-9.\-_]/gi, '_')}`);
  fd.append('publicKey', auth.publicKey);
  fd.append('signature', auth.signature);
  fd.append('expire', auth.expire);
  fd.append('token', auth.token);
  fd.append('folder', '/trans-kr2eng');
  fd.append('useUniqueFileName', 'true');
  const r = await fetch('https://upload.imagekit.io/api/v1/files/upload', { method: 'POST', body: fd });
  const j = await r.json();
  if (!r.ok || !j.url) throw new Error(j.message || 'ImageKit 업로드 실패');
  return j.url;
}

// ---------------------------------------------------------------------------
// Design system
// ---------------------------------------------------------------------------
function Divider({ label = '' }) {
  return (
    <div className="divider">
      <span className="mark">✦</span>
      <span>{label}</span>
      <span className="mark">✦</span>
    </div>
  );
}

function Card({ children, className = '' }) {
  return (
    <section className={`bg-white rounded-2xl border border-gold-100 shadow-sm p-5 ${className}`}>
      {children}
    </section>
  );
}

function Header({ onOpenDoc }) {
  return (
    <header className="border-b border-gold-100 bg-white/80 backdrop-blur sticky top-0 z-30">
      <div className="max-w-6xl mx-auto px-5 h-14 flex items-center justify-between gap-3">
        <a href="#/" className="flex items-center gap-2" onClick={(e) => { e.preventDefault(); onOpenDoc(null); }}>
          <span className="text-xl">📄</span>
          <span className="font-bold text-ink-700 tracking-tight">TradeStatement EN</span>
          <span className="hidden sm:inline text-xs text-gold-700 ml-1">거래내역서 영문 변환기</span>
        </a>
        <nav className="flex items-center gap-1 text-sm">
          <button className="nav-link" onClick={() => onOpenDoc('mission')}>📋 기획서</button>
          <button className="nav-link" onClick={() => onOpenDoc('dev')}>🛠️ 개발문서</button>
          <span className="hidden md:inline text-xs text-gray-400 ml-2">Single-File · Gemini · ImageKit</span>
        </nav>
      </div>
    </header>
  );
}

function DocsModal({ name, onClose }) {
  const [doc, setDoc] = useState(null);
  const [err, setErr] = useState('');
  useEffect(() => {
    if (!name) return;
    setDoc(null); setErr('');
    api(`/api/docs/${name}`).then(setDoc).catch((e) => setErr(e.message));
  }, [name]);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    if (name) window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [name, onClose]);
  if (!name) return null;
  const html = doc && window.marked ? window.marked.parse(doc.content) : '';
  return (
    <div className="modal-backdrop fade-in" onClick={onClose}>
      <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="font-bold text-ink-700 text-lg">{doc?.title || (name === 'mission' ? '기획서' : '개발문서')}</div>
            <div className="text-xs text-gray-500 mt-0.5">
              {name === 'mission'
                ? 'documents/MISSION.md · 제품 비전 · 사용자 · v1 범위 · 성공지표'
                : 'documents/DEV.md · 선택된 구조 · TODO 로드맵 · 외부 설정'}
            </div>
          </div>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-700 text-xl" title="닫기 (Esc)">✕</button>
        </div>
        <div className="modal-body">
          {err && <div className="text-sm text-red-600">⚠️ {err}</div>}
          {!doc && !err && <div className="text-center text-gray-400 py-12">불러오는 중...</div>}
          {doc && <article className="prose" dangerouslySetInnerHTML={{ __html: html }} />}
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Upload step
// ---------------------------------------------------------------------------
function UploadStep({ onParsed, busy, setBusy, setErr }) {
  const [tab, setTab] = useState('file'); // 'file' | 'image'
  const [drag, setDrag] = useState(false);
  const fileRef = useRef();
  const imgRef = useRef();

  const handleFile = useCallback(async (file) => {
    setErr(''); setBusy(true);
    try {
      const fd = new FormData();
      fd.append('file', file);
      const r = await fetch('/api/parse-file', { method: 'POST', body: fd });
      const j = await r.json();
      if (!j.success) throw new Error(j.message || '파싱 실패');
      if (!j.data.rows.length) throw new Error('인식된 거래 행이 없어요. 열 헤더(일자/종목명/적요/수량/단가/금액)를 확인해주세요.');
      onParsed(j.data);
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  }, [onParsed, setBusy, setErr]);

  const handleImage = useCallback(async (file) => {
    setErr(''); setBusy(true);
    try {
      const url = await uploadImage(file);
      const data = await api('/api/parse-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, source_name: file.name }),
      });
      if (!data.rows.length) throw new Error('이미지에서 거래 행을 추출하지 못했어요. 더 선명한 화면을 올려주세요.');
      onParsed(data);
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  }, [onParsed, setBusy, setErr]);

  const onDrop = (e) => {
    e.preventDefault(); setDrag(false);
    const f = e.dataTransfer.files?.[0];
    if (!f) return;
    if (tab === 'file') handleFile(f); else handleImage(f);
  };

  return (
    <Card>
      <div className="flex items-center gap-2 mb-3 border-b border-gold-100">
        <div className={`tab ${tab === 'file'  ? 'active' : ''}`} onClick={() => setTab('file')}>📊 엑셀 / CSV</div>
        <div className={`tab ${tab === 'image' ? 'active' : ''}`} onClick={() => setTab('image')}>🖼️ 이미지 (HTS 캡처)</div>
      </div>

      <div
        className={`dropzone ${drag ? 'drag' : ''}`}
        onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
        onDragLeave={() => setDrag(false)}
        onDrop={onDrop}
      >
        <div className="text-3xl mb-2">{tab === 'file' ? '📥' : '📸'}</div>
        <div className="font-semibold text-ink-700">
          {tab === 'file' ? '엑셀/CSV 파일을 끌어다 놓거나 선택하세요' : 'HTS 화면 캡처·스캔 이미지를 끌어다 놓거나 선택하세요'}
        </div>
        <div className="text-xs text-gray-500 mt-1">
          {tab === 'file'
            ? '인식 가능한 헤더: 일자 · 종목명 · 적요 · 수량 · 단가 · 거래금액 · 통화'
            : 'PNG/JPG · 10MB 이하 · ImageKit에 업로드 후 Gemini Vision으로 거래 행을 추출합니다'}
        </div>
        <div className="mt-4">
          {tab === 'file' ? (
            <>
              <button className="btn-primary" disabled={busy} onClick={() => fileRef.current?.click()}>
                {busy ? '읽는 중...' : '파일 선택'}
              </button>
              <input ref={fileRef} type="file" className="hidden"
                accept=".xlsx,.xls,.csv"
                onChange={(e) => e.target.files?.[0] && handleFile(e.target.files[0])} />
            </>
          ) : (
            <>
              <button className="btn-primary" disabled={busy} onClick={() => imgRef.current?.click()}>
                {busy ? 'AI가 읽는 중...' : '이미지 선택'}
              </button>
              <input ref={imgRef} type="file" className="hidden"
                accept="image/png,image/jpeg,image/jpg"
                onChange={(e) => e.target.files?.[0] && handleImage(e.target.files[0])} />
            </>
          )}
        </div>
      </div>

      <div className="mt-3 text-xs text-gray-500">
        {tab === 'file'
          ? '※ 첫 행을 헤더로 인식합니다. 종목명/적요만 한글이어도 OK — 사전 매칭 + AI fallback으로 영문 변환됩니다.'
          : '※ 이미지는 ImageKit에 업로드된 뒤 Gemini가 거래 행을 표 구조로 추출합니다. 인식이 부정확하면 미리보기에서 직접 수정하세요.'}
      </div>
    </Card>
  );
}

// ---------------------------------------------------------------------------
// Preview + Convert step
// ---------------------------------------------------------------------------
function PreviewStep({ parsed, onConverted, busy, setBusy, setErr, onReset }) {
  // editable rows
  const [rows, setRows] = useState(() => parsed.rows.map(r => ({
    date: r.date || '', stock_ko: r.stock_ko || '', memo_ko: r.memo_ko || '',
    quantity: r.quantity || '', unit_price: r.unit_price || '',
    amount: r.amount || '', currency: r.currency || 'KRW',
  })));
  const update = (idx, key, val) => setRows((p) => p.map((r, i) => i === idx ? { ...r, [key]: val } : r));
  const remove = (idx) => setRows((p) => p.filter((_, i) => i !== idx));

  const convert = async () => {
    setErr(''); setBusy(true);
    try {
      const data = await api('/api/convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          rows,
          source_type: parsed.source_type,
          source_name: parsed.source_name,
          source_image_url: parsed.source_image_url || '',
        }),
      });
      onConverted({ ...parsed, rows: data.rows, job_id: data.job_id, ai_new_terms: data.ai_new_terms });
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };

  return (
    <Card>
      <div className="flex items-center justify-between mb-3">
        <div>
          <div className="font-bold text-ink-700">📋 한글 거래내역 미리보기</div>
          <div className="text-xs text-gray-500 mt-0.5">
            {parsed.source_type === 'image' ? '🖼️' : '📊'} {parsed.source_name} · {rows.length} 행
          </div>
        </div>
        <div className="flex gap-2">
          <button className="btn-ghost" onClick={onReset}>다시 업로드</button>
          <button className="btn-primary" onClick={convert} disabled={busy || rows.length === 0}>
            {busy ? '변환 중...' : '⇨ 영문으로 변환'}
          </button>
        </div>
      </div>

      {parsed.source_image_url && (
        <div className="mb-3">
          <img src={parsed.source_image_url} alt="원본 이미지" className="max-h-56 rounded-lg border border-gold-100" />
        </div>
      )}

      <div className="overflow-auto rounded-lg border border-gold-100">
        <table className="fancy">
          <thead>
            <tr>
              <th>No.</th><th>일자</th><th>종목명 (KR)</th><th>적요 (KR)</th>
              <th>수량</th><th>단가</th><th>금액</th><th>통화</th><th></th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i}>
                <td>{i + 1}</td>
                <td><input className="input" style={{ height: 30, fontSize: 12, padding: '0 6px' }} value={r.date} onChange={(e) => update(i, 'date', e.target.value)} /></td>
                <td><input className="input" style={{ height: 30, fontSize: 12, padding: '0 6px' }} value={r.stock_ko} onChange={(e) => update(i, 'stock_ko', e.target.value)} /></td>
                <td><input className="input" style={{ height: 30, fontSize: 12, padding: '0 6px' }} value={r.memo_ko} onChange={(e) => update(i, 'memo_ko', e.target.value)} /></td>
                <td className="num"><input className="input" style={{ height: 30, fontSize: 12, padding: '0 6px', textAlign: 'right' }} value={r.quantity} onChange={(e) => update(i, 'quantity', e.target.value)} /></td>
                <td className="num"><input className="input" style={{ height: 30, fontSize: 12, padding: '0 6px', textAlign: 'right' }} value={r.unit_price} onChange={(e) => update(i, 'unit_price', e.target.value)} /></td>
                <td className="num"><input className="input" style={{ height: 30, fontSize: 12, padding: '0 6px', textAlign: 'right' }} value={r.amount} onChange={(e) => update(i, 'amount', e.target.value)} /></td>
                <td><input className="input" style={{ height: 30, fontSize: 12, padding: '0 6px' }} value={r.currency} onChange={(e) => update(i, 'currency', e.target.value)} /></td>
                <td><button onClick={() => remove(i)} className="text-gray-400 hover:text-red-500" title="행 삭제">✕</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Card>
  );
}

// ---------------------------------------------------------------------------
// Result + Download step
// ---------------------------------------------------------------------------
function ResultStep({ result, onReset, setErr }) {
  const [downloading, setDownloading] = useState('');

  const download = async (kind) => {
    setErr(''); setDownloading(kind);
    try {
      const r = await fetch(`/api/download/${kind}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rows: result.rows, source_name: result.source_name }),
      });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.message || `HTTP ${r.status}`);
      }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `trade-statement-en-${Date.now()}.${kind === 'pdf' ? 'pdf' : 'xlsx'}`;
      document.body.appendChild(a); a.click();
      a.remove(); URL.revokeObjectURL(url);
    } catch (e) { setErr(e.message); }
    finally { setDownloading(''); }
  };

  return (
    <Card>
      <div className="flex items-center justify-between mb-3">
        <div>
          <div className="font-bold text-ink-700">✅ 영문 변환 결과</div>
          <div className="text-xs text-gray-500 mt-0.5">
            Job #{result.job_id} · {result.rows.length} 행 ·{' '}
            <span className="text-gold-700">신규 AI 번역 {result.ai_new_terms}건이 사전에 누적됨</span>
          </div>
        </div>
        <div className="flex gap-2">
          <button className="btn-ghost" onClick={onReset}>새 변환</button>
          <button className="btn-primary" disabled={!!downloading} onClick={() => download('excel')}>
            {downloading === 'excel' ? '준비 중...' : '📥 영문 Excel'}
          </button>
          <button className="btn-primary" disabled={!!downloading} onClick={() => download('pdf')}>
            {downloading === 'pdf' ? '준비 중...' : '📄 영문 PDF'}
          </button>
        </div>
      </div>

      <div className="overflow-auto rounded-lg border border-gold-100">
        <table className="fancy">
          <thead>
            <tr>
              <th>No.</th><th>Date</th>
              <th>Stock (KR → EN)</th><th>Memo (KR → EN)</th>
              <th>Quantity</th><th>Unit Price</th><th>Amount</th><th>CCY</th>
            </tr>
          </thead>
          <tbody>
            {result.rows.map((r, i) => (
              <tr key={i}>
                <td>{i + 1}</td>
                <td>{r.date}</td>
                <td>
                  <div className="text-gray-400 text-xs">{r.stock_ko}</div>
                  <div className="font-semibold text-ink-700">{r.stock_en || <span className="text-red-500 text-xs">— 미번역 —</span>}</div>
                </td>
                <td>
                  <div className="text-gray-400 text-xs">{r.memo_ko}</div>
                  <div className="font-semibold text-ink-700">{r.memo_en || <span className="text-red-500 text-xs">— 미번역 —</span>}</div>
                </td>
                <td className="num">{r.quantity}</td>
                <td className="num">{r.unit_price}</td>
                <td className="num">{r.amount}</td>
                <td>{r.currency}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Card>
  );
}

// ---------------------------------------------------------------------------
// Dictionary panel (auxiliary)
// ---------------------------------------------------------------------------
function DictionaryPanel() {
  const [open, setOpen] = useState(false);
  const [items, setItems] = useState([]);
  const [kind, setKind] = useState('stock');
  const load = useCallback(async () => {
    try { setItems(await api(`/api/dictionary?kind=${kind}`)); } catch {}
  }, [kind]);
  useEffect(() => { if (open) load(); }, [open, load]);
  return (
    <Card>
      <div className="flex items-center justify-between">
        <div>
          <div className="font-bold text-ink-700">📚 누적 사전</div>
          <div className="text-xs text-gray-500 mt-0.5">쓸수록 두꺼워지는 사내 표준 번역어</div>
        </div>
        <button className="btn-ghost" onClick={() => setOpen((o) => !o)}>
          {open ? '접기' : '펼치기'}
        </button>
      </div>
      {open && (
        <div className="mt-3">
          <div className="flex gap-2 mb-3 text-sm">
            <button className={`tab ${kind === 'stock' ? 'active' : ''}`} onClick={() => setKind('stock')}>종목명</button>
            <button className={`tab ${kind === 'memo'  ? 'active' : ''}`} onClick={() => setKind('memo')}>적요</button>
          </div>
          <div className="overflow-auto max-h-72 rounded-lg border border-gold-100">
            <table className="fancy">
              <thead><tr><th>한글</th><th>영문</th><th>출처</th><th>히트</th></tr></thead>
              <tbody>
                {items.length === 0 && <tr><td colSpan={4} className="text-center text-gray-400 py-6">아직 사전에 누적된 항목이 없어요</td></tr>}
                {items.map((d, i) => (
                  <tr key={i}>
                    <td>{d.ko}</td>
                    <td className="font-semibold text-ink-700">{d.en}</td>
                    <td><span className={`text-xs px-2 py-0.5 rounded-full ${d.source === 'ai' ? 'bg-gold-100 text-gold-700' : 'bg-ink-50 text-ink-700'}`}>{d.source}</span></td>
                    <td className="num">{d.hit_count}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </Card>
  );
}

// ---------------------------------------------------------------------------
// App
// ---------------------------------------------------------------------------
function App() {
  const [parsed, setParsed]   = useState(null);  // { rows, source_type, source_name, source_image_url? }
  const [result, setResult]   = useState(null);  // { rows: english, job_id, ai_new_terms, ... }
  const [busy, setBusy]       = useState(false);
  const [err, setErr]         = useState('');
  const [docName, setDocName] = useState(null);  // 'mission' | 'dev' | null

  const reset = () => { setParsed(null); setResult(null); setErr(''); };

  return (
    <div className="min-h-full pb-16">
      <Header onOpenDoc={setDocName} />
      <main className="max-w-6xl mx-auto px-5 py-6">
        {/* Hero */}
        <section className="bg-gradient-to-br from-ink-700 to-ink-800 text-white rounded-3xl p-6 mb-2">
          <div className="text-xs text-gold-300 font-semibold tracking-wide">증권 거래내역서 · KR → EN</div>
          <h1 className="text-2xl sm:text-3xl font-bold mt-1">반나절이 걸리던 영문 변환을 30초 안에.</h1>
          <p className="text-sm text-ink-100 mt-2 max-w-2xl">
            지점 직원이 한글 거래내역서를 그대로 올리면, 사전 매칭 + Gemini가 종목명·적요를 영문으로 바꾸고 공식 PDF·엑셀로 내려줍니다.
            한 번 번역된 표현은 사전에 누적되어, 다음부터는 회사 전체가 같은 영문을 씁니다.
          </p>
        </section>

        <Divider label="Workflow" />

        {!parsed && (
          <UploadStep
            onParsed={setParsed}
            busy={busy} setBusy={setBusy} setErr={setErr}
          />
        )}

        {parsed && !result && (
          <PreviewStep
            parsed={parsed}
            onConverted={setResult}
            busy={busy} setBusy={setBusy} setErr={setErr}
            onReset={reset}
          />
        )}

        {result && (
          <ResultStep
            result={result}
            onReset={reset}
            setErr={setErr}
          />
        )}

        {err && (
          <div className="mt-3 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-4 py-2 fade-in">
            ⚠️ {err}
          </div>
        )}

        <Divider label="Library" />

        <DictionaryPanel />

        <Divider label="About" />

        <div className="text-xs text-gray-500 text-center">
          <p>Single-file React + Express · Gemini 2.5 Flash · ImageKit · Supabase Postgres</p>
          <p className="mt-1">
            © Trade Statement EN — for internal use only ·{' '}
            <button className="underline hover:text-ink-700" onClick={() => setDocName('mission')}>기획서</button>{' '}·{' '}
            <button className="underline hover:text-ink-700" onClick={() => setDocName('dev')}>개발문서</button>
          </p>
        </div>
      </main>

      <DocsModal name={docName} onClose={() => setDocName(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
