<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4ede4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
    <feOffset dx="0" dy="6" result="offsetblur"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  </defs>
  
    <defs>
      <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3a2a1a" stop-opacity="0.0"/>
        <stop offset="60%" stop-color="#3a2a1a" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#3a2a1a" stop-opacity="0.7"/>
      </linearGradient>
    </defs>

  <!-- background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- subtle marble/paper texture lines -->
  <g opacity="0.06" stroke="#000">
    <line x1="0" y1="160" x2="800" y2="160" stroke-width="1"/>
    <line x1="0" y1="700" x2="800" y2="700" stroke-width="1"/>
  </g>

  <!-- bottle group with shadow -->
  <g filter="url(#sh)">
    <rect x="260" y="270" width="280" height="380" rx="10" fill="#1a1a1a" stroke="#000" stroke-width="2" />

    <!-- liquid shading overlay (clipped to a generic full bottle area) -->
    <rect x="260" y="270" width="280" height="380" rx="10" fill="url(#liq)"/>

    <!-- neck -->
    <rect x="364" y="190" width="72" height="80" fill="#1a1a1a" stroke="#000" stroke-width="2"/>

    <!-- cap -->
    <rect x="336" y="120" width="128" height="80" rx="6" fill="#bfa46a" stroke="#8b7841" stroke-width="2"/>
    <rect x="336" y="120" width="128" height="14" rx="2" fill="#8b7841" opacity="0.4"/>
  </g>

  <!-- label -->
  <g>
    <rect x="295" y="430" width="210" height="120" rx="2" fill="#ffffff" opacity="0.97"/>
    <line x1="320" y1="455" x2="480" y2="455" stroke="#bfa46a" stroke-width="1"/>
    <text x="400" y="445" text-anchor="middle"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="14" letter-spacing="6" font-weight="700" fill="#1a1a1a">ZARA</text>
    <text x="400" y="495" text-anchor="middle"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="20" letter-spacing="3" font-weight="500" fill="#1a1a1a">BLACK AMBER</text>
    <text x="400" y="525" text-anchor="middle"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="10" letter-spacing="2" fill="#1a1a1a" opacity="0.7">EAU DE PARFUM · 100ML</text>
  </g>

  <!-- floor reflection -->
  <ellipse cx="400" cy="700" rx="220" ry="14" fill="#000" opacity="0.08"/>
</svg>