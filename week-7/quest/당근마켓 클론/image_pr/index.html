<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZARA 향수 갤러리 (ImageKit)</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 24px; min-height: 100vh;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #faf7f2, #ffffff 70%);
    color: #1a1a1a;
  }
  header {
    max-width: 1100px; margin: 0 auto 36px;
    text-align: center;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 28px; letter-spacing: 12px; font-weight: 700;
  }
  p.sub {
    margin: 0; color: #777; letter-spacing: 4px; font-size: 12px;
  }
  .grid {
    max-width: 1100px; margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
  }
  .card {
    background: #fff;
    border: 1px solid #ece6dd;
    overflow: hidden;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -20px rgba(0,0,0,.18); }
  .card img { display:block; width: 100%; height: auto; aspect-ratio: 1; object-fit: contain; background: #f7f2ea; }
  .card-meta { padding: 16px; border-top: 1px solid #ece6dd; }
  .name { font-size: 14px; letter-spacing: 4px; font-weight: 600; }
  .url {
    margin-top: 8px;
    font-size: 11px; color: #888; word-break: break-all;
    font-family: 'SFMono-Regular', Menlo, monospace;
  }
  .url a { color: inherit; text-decoration: none; border-bottom: 1px solid #e0d8c8; }
  .url a:hover { color: #1a1a1a; }
  footer { text-align: center; margin-top: 48px; color: #999; font-size: 12px; letter-spacing: 2px; }
</style>
</head>
<body>
<header>
  <h1>Z A R A&nbsp;&nbsp;&nbsp;P E R F U M E</h1>
  <p class="sub">IMAGEKIT · 4 EDITIONS</p>
</header>
<div class="grid" id="grid"></div>
<footer>made for week-7 quest · ik.imagekit.io/3um8y0hge</footer>
<script>
  fetch('manifest.json').then(r => r.json()).then((items) => {
    const grid = document.getElementById('grid');
    grid.innerHTML = items.map((it) => `
      <div class="card">
        <img src="${it.url}" alt="ZARA ${it.name}" loading="lazy" />
        <div class="card-meta">
          <div class="name">${it.name}</div>
          <div class="url"><a href="${it.url}" target="_blank" rel="noopener">${it.url}</a></div>
        </div>
      </div>
    `).join('');
  });
</script>
</body>
</html>
